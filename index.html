<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>High School Used Books Marketplace</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f4f4f4;
    }
    header {
      background: #2c3e50;
      color: white;
      padding: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 {
      margin: 0;
      font-size: 1.3rem;
    }
    .container {
      padding: 1rem;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1rem;
    }
    .card {
      background: white;
      padding: 1rem;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .card.sold {
      opacity: 0.5;
    }
    .price {
      font-weight: bold;
    }
    .sold-label {
      color: red;
      font-weight: bold;
    }
    button, a.button {
      background: #3498db;
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 5px;
      cursor: pointer;
      text-decoration: none;
    }
    .top-buttons button {
      margin-left: 0.5rem;
    }
  </style>
</head>

<body>

<header>
  <h1>📚 Used Books Marketplace</h1>
  <div class="top-buttons">
    <a href="upload.html" class="button">Upload</a>
    <button id="loginBtn">Login</button>
    <button id="logoutBtn" style="display:none">Logout</button>
  </div>
</header>

<div class="container">
  <p>For students only. Meet in person. No online payments.</p>
  <p id="stats"></p>
  <div class="grid" id="books"></div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
  import { getAuth, onAuthStateChanged, signInWithPopup, GoogleAuthProvider, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

  // 🔥 Firebase config (yours)
  const firebaseConfig = {
    apiKey: "AIzaSyBo975fUWgxYJwGb2Ie4zIcxPb2-etH8ic",
    authDomain: "used-book-shop.firebaseapp.com",
    projectId: "used-book-shop",
    storageBucket: "used-book-shop.firebasestorage.app",
    messagingSenderId: "95397772472",
    appId: "1:95397772472:web:2e70a9cd2e5e532f2e884d",
    measurementId: "G-EEZ7CYSM1E"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);
  const provider = new GoogleAuthProvider();

  const booksDiv = document.getElementById("books");
  const stats = document.getElementById("stats");
  const loginBtn = document.getElementById("loginBtn");
  const logoutBtn = document.getElementById("logoutBtn");

  // Login / logout
  loginBtn.onclick = () => signInWithPopup(auth, provider);
  logoutBtn.onclick = () => signOut(auth);

  onAuthStateChanged(auth, user => {
    loginBtn.style.display = user ? "none" : "inline";
    logoutBtn.style.display = user ? "inline" : "none";
  });

  // Load books
  async function loadBooks() {
    const snapshot = await getDocs(collection(db, "books"));
    let total = 0;
    let available = 0;

    booksDiv.innerHTML = "";

    snapshot.forEach(doc => {
      total++;
      const book = doc.data();
      if (!book.sold) available++;

      const card = document.createElement("div");
      card.className = "card" + (book.sold ? " sold" : "");

      card.innerHTML = `
        <h3>${book.title}</h3>
        <p class="price">${book.price}₮</p>
        ${book.sold ? '<p class="sold-label">SOLD</p>' : ''}
        <button onclick="location.href='login.html'">Preview</button>
      `;

      booksDiv.appendChild(card);
    });

    stats.textContent = `Total books: ${total} · Available: ${available}`;
  }

  loadBooks();
</script>

</body>
</html>
