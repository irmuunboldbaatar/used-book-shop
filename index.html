<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Used Books Marketplace</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f5f5f5; }
    header { background: #1f2937; color: white; padding: 1rem; text-align: center; }
    main { padding: 1rem; max-width: 900px; margin: auto; }
    h2 { margin-top: 2rem; }
    form { background: white; padding: 1rem; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
    input, select, button { width: 100%; padding: 0.6rem; margin: 0.4rem 0; }
    button { background: #2563eb; color: white; border: none; border-radius: 6px; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 1rem; }
    .card { background: white; border-radius: 8px; padding: 0.5rem; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
    .card img { width: 100%; height: 200px; object-fit: cover; border-radius: 6px; }
    .price { font-weight: bold; color: #059669; }
  </style>
</head>
<body>
  <header>
    <h1>📚 Used Books Marketplace</h1>
    <p>Buy & sell textbooks inside our school</p>
  </header>

  <main>
    <h2>🔥 Recent Books</h2>
    <div id="bookGrid" class="grid"></div>

    <h2>🔍 Search Books</h2>
    <input id="searchInput" placeholder="Search by title or subject" />

    <h2>➕ Post a Book</h2>
    <form id="bookForm">
      <input required placeholder="Book title" id="title" />
      <input required placeholder="Subject" id="subject" />
      <input required type="number" placeholder="Grade" id="grade" />
      <input required type="number" placeholder="Price" id="price" />
      <input required placeholder="Contact info" id="contact" />
      <input required type="file" id="image" accept="image/*" />
      <button type="submit">Upload Book</button>
    </form>
  </main>

  <!-- Firebase -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      projectId: "YOUR_PROJECT",
      storageBucket: "YOUR_PROJECT.appspot.com",
      messagingSenderId: "XXXX",
      appId: "XXXX"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const storage = getStorage(app);

    const bookGrid = document.getElementById('bookGrid');
    const searchInput = document.getElementById('searchInput');

    const q = query(collection(db, 'books'), orderBy('createdAt', 'desc'));
    onSnapshot(q, snapshot => {
      render(snapshot.docs.map(d => d.data()));
    });

    function render(books) {
      const search = searchInput.value.toLowerCase();
      bookGrid.innerHTML = '';
      books.filter(b =>
        b.title.toLowerCase().includes(search) ||
        b.subject.toLowerCase().includes(search)
      ).forEach(book => {
        const div = document.createElement('div');
        div.className = 'card';
        div.innerHTML = `
          <img src="${book.imageUrl}" />
          <h4>${book.title}</h4>
          <p>${book.subject} · Grade ${book.grade}</p>
          <p class="price">${book.price}₮</p>
          <p>📞 ${book.contact}</p>
        `;
        bookGrid.appendChild(div);
      });
    }

    searchInput.addEventListener('input', () => render([]));

    document.getElementById('bookForm').addEventListener('submit', async e => {
      e.preventDefault();

      const file = image.files[0];
      const imgRef = ref(storage, 'books/' + Date.now());
      await uploadBytes(imgRef, file);
      const imageUrl = await getDownloadURL(imgRef);

      await addDoc(collection(db, 'books'), {
        title: title.value,
        subject: subject.value,
        grade: Number(grade.value),
        price: Number(price.value),
        contact: contact.value,
        imageUrl,
        createdAt: Date.now()
      });

      e.target.reset();
    });
  </script>
</body>
</html>
